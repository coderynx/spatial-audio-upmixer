[project]
name = "upmixer-web"
version = "0.1.0"
description = "Web API for the upmixer spatial audio upmixer"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "upmixer",
    "alembic>=1.13",
    "fastapi>=0.115",
    "mutagen>=1.47",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
web-dev = [
    "httpx>=0.27",
]
web-postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
upmixer-web = "upmixer_web.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "upmixer_web",
    "upmixer_web.migrations",
    "upmixer_web.migrations.versions",
]

[tool.setuptools.package-dir]
upmixer_web = "src"

[tool.setuptools.package-data]
upmixer_web = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
markers = [
    "perf: performance benchmarks (run with -m perf; skipped in CI by default)",
]
