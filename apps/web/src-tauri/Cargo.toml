[package]
name = "upmixer-desktop"
version = "0.1.0"
description = "Native desktop host for Upmixer"
edition = "2021"

[lib]
name = "upmixer_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "vorbis", "wav", "pcm"] }
tauri = { version = "2.11.5", features = [] }
upmixer-dsp-core = { path = "../../../packages/dsp/crates/dsp-core" }
