[workspace]
members = ["crates/dsp-core", "crates/dsp-py", "crates/dsp-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
upmixer-dsp-core = { path = "crates/dsp-core" }
rustfft = "6"
realfft = "3"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
