# Inference fields from ZFTurbo's v1.0.15 release configuration.
# https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v1.0.15/config_musdb18_scnet_xl_more_wide_v5.yaml
audio:
  chunk_size: 485100
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  sources: [drums, bass, other, vocals]
  audio_channels: 2
  dims: [4, 64, 128, 256]
  nfft: 4096
  hop_size: 1024
  win_size: 4096
  normalized: true
  band_SR: [0.230, 0.370, 0.400]
  band_stride: [1, 4, 4]
  band_kernel: [3, 4, 4]
  conv_depths: [3, 3, 3]
  compress: 4
  conv_kernel: 3
  num_dplayer: 8
  expand: 1

training:
  instruments: [drums, bass, other, vocals]
  target_instrument: null

inference:
  batch_size: 4
  dim_t: 256
  num_overlap: 4
  normalize: false
