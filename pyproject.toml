# Virtual workspace root — this repository has no installable code of its
# own. Each real package lives under packages/ or apps/ with its own
# pyproject.toml; see AGENTS.md for the monorepo layout.
[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/cli"]

[tool.pytest.ini_options]
markers = [
    "perf: performance benchmarks (run with -m perf; skipped in CI by default)",
]
